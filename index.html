<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloj · Liquid Glass XR</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    background:
      radial-gradient(60vmax 60vmax at 15% 10%, #3b6bff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 90% 95%, #ff5fa2 0%, transparent 60%),
      #0b1020;
    color: #fff;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .ui {
    position: fixed; z-index: 10; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(92vw, 420px); text-align: center;
  }
  button {
    font: inherit; font-size: 1.05rem; font-weight: 500; color: #fff;
    padding: 14px 28px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,.6), 0 12px 30px -10px rgba(0,0,0,.5);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  button[hidden] { display: none; }
  #msg { font-size: .95rem; color: rgba(255,255,255,.7); line-height: 1.4; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
</head>
<body>

<div class="ui">
  <button id="enter" type="button" hidden>Entrar en AR</button>
  <p id="msg">Comprobando compatibilidad con AR…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, "Segoe UI", sans-serif';
  const W = 1024, H = 512;          // píxeles del lienzo
  const PW = 0.8, PH = 0.4;         // tamaño del panel en metros
  const K = PW / W;
  const S = 2;                      // factor de resolución de los lienzos                 // metros por píxel

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let h24 = store.get('clockxr.h24', '1') === '1';

  const enterBtn = document.getElementById('enter');
  const msg = document.getElementById('msg');

  /* ---------- Escena ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearAlpha(0);              // transparente: así se ve el passthrough
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.xr.enabled = true;
  renderer.xr.setFramebufferScaleFactor(1.5);   // más nitidez en el visor
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 20);
  camera.position.set(0, 1.6, 0);

  /* ---------- Textura de cristal dibujada en canvas ---------- */
  const canvas = document.createElement('canvas');
  canvas.width = W * S; canvas.height = H * S;
  const ctx = canvas.getContext('2d');
  ctx.scale(S, S);
  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;
  texture.anisotropy = 8;

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    // Vidrio gris cálido estilo visionOS
    rr(ctx, 8, 8, W - 16, H - 16, 110);
    glass(ctx, W, H);

    // Hora
    let hh = now.getHours(), suffix = '';
    if (!h24) { suffix = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; }
    const text = (h24 ? String(hh).padStart(2, '0') : String(hh)) + ':' + String(now.getMinutes()).padStart(2, '0');
    const sec = String(now.getSeconds()).padStart(2, '0');

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = `200 250px ${FONT}`;
    const w0 = ctx.measureText('0').width;       // ancho fijo por dígito
    const slot = c => (c === ':' ? w0 * 0.42 : w0);
    const timeW = [...text].reduce((a, c) => a + slot(c), 0);

    ctx.font = `300 96px ${FONT}`;
    const secW = showSec ? ctx.measureText('00').width : 0;
    const gap = showSec ? 28 : 0;
    let x = (W - (timeW + gap + secW)) / 2;
    const base = 300;

    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.shadowColor = 'rgba(255,255,255,0.35)';
    ctx.shadowBlur = 24;
    ctx.font = `200 250px ${FONT}`;
    ctx.textAlign = 'center';
    for (const c of text) {
      ctx.fillText(c, x + slot(c) / 2, base);
      x += slot(c);
    }
    ctx.shadowBlur = 0;

    // Segundos y AM/PM
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.font = `300 96px ${FONT}`;
    if (showSec) ctx.fillText(sec, x + gap, base);
    if (!h24) {
      ctx.font = `500 44px ${FONT}`;
      ctx.fillText(suffix, x + gap, base - 150);
    }

    // Fecha
    let d = dateFmt.format(now);
    d = d.charAt(0).toUpperCase() + d.slice(1);
    ctx.textAlign = 'center';
    ctx.font = `400 44px ${FONT}`;
    ctx.fillStyle = 'rgba(255,255,255,0.66)';
    ctx.fillText(d, W / 2, 390);

    // Pista de la barra de segundos
    if (showSec) {
      roundRect(96, 447, W - 192, 6, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fill();
    }

    texture.needsUpdate = true;
  }

  /* ---------- Panel ---------- */
  const group = new THREE.Group();
  const HOME = new THREE.Vector3(0, 1.6, -1.2);
  group.position.copy(HOME);
  scene.add(group);

  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(PW, PH),
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
  );
  group.add(panel);

  // Barra de segundos: malla aparte para que avance suave sin redibujar el lienzo
  const barW = (W - 192) * K;
  const barGeo = new THREE.PlaneGeometry(barW, 6 * K);
  barGeo.translate(barW / 2, 0, 0);
  const bar = new THREE.Mesh(
    barGeo,
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92, depthWrite: false })
  );
  bar.position.set((96 - W / 2) * K, (H / 2 - 450) * K, 0.002);
  group.add(bar);

  /* ---------- Ornamento lateral, barra de agarre e interacción ---------- */
  let showSec = store.get('clockxr.sec', '1') === '1';
  let hover = '', drag = null, rz = null;
  const nv = new THREE.Vector3(), pt = new THREE.Vector3(), pl = new THREE.Plane();
  function planePt(c) {                // punto donde el rayo corta el plano del reloj
    aim(c); raycaster.set(ro, rd);
    group.getWorldDirection(nv); pl.setFromNormalAndCoplanarPoint(nv, group.position);
    return raycaster.ray.intersectPlane(pl, pt);
  }

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function glass(g, w, h) {            // rellena el trazado actual: gris oscuro translúcido con degradado a negro
    g.fillStyle = 'rgba(62,60,59,0.64)'; g.fill();
    const a = g.createLinearGradient(0, 0, w * 0.4, h);
    a.addColorStop(0, 'rgba(255,255,255,.07)'); a.addColorStop(1, 'rgba(0,0,0,.26)');
    g.fillStyle = a; g.fill();
  }
  function mk(w, h, cw, ch, x, y, z, parent) {
    const c = document.createElement('canvas'); c.width = cw * S; c.height = ch * S;
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
    m.position.set(x, y, z); (parent || group).add(m);
    const g = c.getContext('2d'); g.scale(S, S);
    return { g, t, m };
  }
  const orn = mk(0.08, 0.2, 160, 400, -0.44, 0, 0.012);
  const grab = mk(0.448, 0.056, 512, 64, 0, -0.262, 0.004);
  const corners = [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([sx, sy], i) => {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.013, 0.02, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }));
    m.position.set(sx * 0.387, sy * 0.187, 0.006); m.userData.id = 'c' + i; group.add(m); return m;
  });

  function drawOrn() {
    const g = orn.g; g.clearRect(0, 0, 160, 400);
    rr(g, 10, 10, 140, 380, 70); glass(g, 160, 400);
    for (let i = 0; i < 3; i++) {
      const cy = 88 + 112 * i;
      if (hover === 'o' + i) { g.beginPath(); g.arc(80, cy, 50, 0, 7); g.fillStyle = 'rgba(255,255,255,.28)'; g.fill(); }
      g.fillStyle = g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 5; g.textAlign = 'center';
      if (i === 0) { g.font = `500 38px ${FONT}`; g.fillText(h24 ? '24h' : '12h', 80, cy + 13); }
      else if (i === 1) {                                  // cronómetro: segundos
        g.globalAlpha = showSec ? 1 : 0.4;
        g.beginPath(); g.arc(80, cy + 4, 24, 0, 7); g.stroke();
        g.fillRect(72, cy - 32, 16, 6);
        g.beginPath(); g.moveTo(80, cy + 4); g.lineTo(80, cy - 12); g.stroke();
        g.globalAlpha = 1;
      } else {                                             // diana: recentrar
        g.beginPath(); g.arc(80, cy, 8, 0, 7); g.fill();
        g.beginPath(); g.arc(80, cy, 26, 0, 7); g.stroke();
      }
    }
    orn.t.needsUpdate = true;
  }
  function drawGrab() {
    const g = grab.g; g.clearRect(0, 0, 512, 64);
    g.beginPath(); g.arc(40, 32, 18, 0, 7);
    g.fillStyle = hover === 'dot' ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.45)'; g.fill();
    rr(g, 96, 20, 368, 24, 12);
    g.fillStyle = hover === 'grab' ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.45)'; g.fill();
    grab.t.needsUpdate = true;
  }

  const raycaster = new THREE.Raycaster();
  const tmp = new THREE.Matrix4(), ro = new THREE.Vector3(), rd = new THREE.Vector3();

  function refresh() { lastSecond = -1; bar.visible = showSec; drawOrn(); }
  function toggleFormat() { h24 = !h24; store.set('clockxr.h24', h24 ? '1' : '0'); refresh(); }

  function aim(c) {
    tmp.identity().extractRotation(c.matrixWorld);
    ro.setFromMatrixPosition(c.matrixWorld);
    rd.set(0, 0, -1).applyMatrix4(tmp);
  }
  function pick(c) {
    aim(c); raycaster.set(ro, rd);
    const h = raycaster.intersectObjects([grab.m, orn.m, panel, ...corners, ...wmeshes])[0];
    if (!h) return null;
    let id = 'panel';
    if (h.object === orn.m) { const y = (1 - h.uv.y) * 400; id = 'o' + (y < 144 ? 0 : y < 256 ? 1 : 2); }
    else if (h.object === grab.m) id = h.uv.x < 0.16 ? 'dot' : 'grab';
    else if (h.object.userData.id) id = h.object.userData.id;
    return { id, point: h.point, uv: h.uv, own: h.object.userData.own };
  }

  const ctrls = [0, 1].map(i => renderer.xr.getController(i));
  const dots = ctrls.map(() => {
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.008, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
    d.renderOrder = 10; d.visible = false; scene.add(d); return d;
  });
  ctrls.forEach(c => {
    c.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1.5)]),
      new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22 })
    ));
    c.addEventListener('connected', e => { c.userData.gp = e.data.gamepad; });
    c.addEventListener('selectstart', () => {
      const h = pick(c); if (!h) return;
      if (h.id === 'panel' || h.id === 'o0') toggleFormat();
      else if (h.id === 'o1') { showSec = !showSec; store.set('clockxr.sec', showSec ? '1' : '0'); refresh(); }
      else if (h.id === 'o2') { placed = false; frames = 999; }
      else if (h.id === 'dot') { if (session) session.end(); }
      else if (h.id === 'wgrab') drag = { c, dist: h.point.distanceTo(ro), off: h.own.grp.position.clone().sub(h.point), tg: h.own.grp };
      else if (h.id === 'wface') wTap(h);
      else if (h.id[0] === 'c') { if (planePt(c)) rz = { c, i: +h.id[1], d0: pt.distanceTo(group.position), s0: group.scale.x }; }
      else if (h.id === 'grab') drag = { c, dist: h.point.distanceTo(ro), off: group.position.clone().sub(h.point), tg: group };
    });
    c.addEventListener('selectend', () => { if (drag && drag.c === c) drag = null; if (rz && rz.c === c) rz = null; });
    scene.add(c);
  });

  // Hover, reticulas y arrastre (se llama cada fotograma en AR)
  function updateXR() {
    let hv = '';
    ctrls.forEach((c, i) => {
      const h = pick(c);
      dots[i].visible = !!h;
      if (h) { dots[i].position.copy(h.point); dots[i].lookAt(ro); if (!hv || h.id !== 'panel') hv = h.id; }
    });
    if (drag) {
      const c = drag.c, gp = c.userData.gp;
      aim(c);
      if (gp && gp.axes[3]) drag.dist = THREE.MathUtils.clamp(drag.dist - gp.axes[3] * 0.03, 0.5, 3);  // palanca: acercar/alejar
      const tg = drag.tg;
      tg.position.copy(ro).addScaledVector(rd, drag.dist).add(drag.off);
      renderer.xr.getCamera(camera).getWorldPosition(v);
      tg.lookAt(v.x, tg.position.y, v.z);
      hv = 'grab';
    }
    if (rz && planePt(rz.c)) {
      group.scale.setScalar(THREE.MathUtils.clamp(rz.s0 * pt.distanceTo(group.position) / rz.d0, 0.5, 3));
      hv = 'c' + rz.i;
    }
    if (hv !== hover) {
      hover = hv; drawOrn(); drawGrab();
      corners.forEach((m, i) => { m.material.opacity = hv === 'c' + i ? 0.75 : 0; });
    }
  }
  drawOrn(); drawGrab(); bar.visible = showSec;

  /* ---------- Widgets: calendario y clima ---------- */
  const LAT = -31.73, LON = -60.52, CITY = 'Paraná';   // cambia estas coordenadas por las tuyas
  const widgets = [], wmeshes = [], lv = new THREE.Vector3();
  let calOff = 0, wx = null, wxErr = false;

  function widget(ox, oy, draw) {
    const grp = new THREE.Group(); scene.add(grp);
    const w = { grp, ox, oy, draw, face: mk(0.4, 0.4, 400, 400, 0, 0, 0, grp), bar: mk(0.28, 0.04, 320, 46, 0, -0.262, 0.002, grp) };
    rr(w.bar.g, 60, 14, 200, 18, 9); w.bar.g.fillStyle = 'rgba(255,255,255,.45)'; w.bar.g.fill(); w.bar.t.needsUpdate = true;
    w.face.m.userData = { id: 'wface', own: w }; w.bar.m.userData = { id: 'wgrab', own: w };
    wmeshes.push(w.face.m, w.bar.m); widgets.push(w); return w;
  }
  function wAll() {
    widgets.forEach(w => {
      const g = w.face.g; g.clearRect(0, 0, 400, 400);
      rr(g, 6, 6, 388, 388, 64); glass(g, 400, 400);
      g.save(); w.draw(g); g.restore(); w.face.t.needsUpdate = true;
    });
  }
  function layout() {                  // coloca los widgets a los lados del reloj
    group.updateMatrixWorld(true);
    widgets.forEach(w => {
      w.grp.position.copy(group.localToWorld(lv.set(w.ox, w.oy, 0)));
      w.grp.quaternion.copy(group.quaternion); w.grp.scale.copy(group.scale);
    });
  }
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

  const cal = widget(-0.72, 0, g => {
    const t = new Date(), d = new Date(t.getFullYear(), t.getMonth() + calOff, 1);
    g.fillStyle = '#fff'; g.textAlign = 'left'; g.font = `500 27px ${FONT}`;
    g.fillText(cap(new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' }).format(d)), 32, 62);
    g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `400 36px ${FONT}`;
    g.fillText('‹', 296, 62); g.fillText('›', 352, 62);
    g.font = `500 17px ${FONT}`; g.fillStyle = 'rgba(255,255,255,.5)';
    ['L', 'M', 'M', 'J', 'V', 'S', 'D'].forEach((n, i) => g.fillText(n, 56 + 48 * i, 112));
    const start = (d.getDay() + 6) % 7;
    g.font = `400 22px ${FONT}`;
    for (let i = 0; i < 42; i++) {
      const day = new Date(d.getFullYear(), d.getMonth(), 1 - start + i);
      const cx = 56 + 48 * (i % 7), cy = 150 + 40 * Math.floor(i / 7);
      if (day.toDateString() === t.toDateString()) {
        g.beginPath(); g.arc(cx, cy - 7, 18, 0, 7); g.fillStyle = '#fff'; g.fill(); g.fillStyle = '#222';
      } else g.fillStyle = day.getMonth() === d.getMonth() ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.28)';
      g.fillText(String(day.getDate()), cx, cy);
    }
  });

  function icon(g, k, x, y, s) {
    const circ = (cx, cy, r) => { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); };
    g.lineCap = 'round';
    if (k === 'sun' || k === 'part') {
      const sx = k === 'part' ? x - s * .2 : x, sy = k === 'part' ? y - s * .2 : y;
      g.fillStyle = g.strokeStyle = '#ffd24a'; g.lineWidth = s * .06; circ(sx, sy, s * .22);
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4; g.beginPath();
        g.moveTo(sx + Math.cos(a) * s * .32, sy + Math.sin(a) * s * .32); g.lineTo(sx + Math.cos(a) * s * .42, sy + Math.sin(a) * s * .42); g.stroke();
      }
    }
    if (k === 'sun') return;
    const cy = k === 'part' ? y + s * .12 : y - s * .05, py = cy + s * .3;
    g.fillStyle = 'rgba(255,255,255,.93)';
    circ(x - s * .2, cy + s * .08, s * .17); circ(x, cy - s * .05, s * .22); circ(x + s * .22, cy + s * .08, s * .15);
    g.fillRect(x - s * .2, cy + s * .08, s * .42, s * .15);
    g.strokeStyle = k === 'storm' ? '#ffd24a' : '#7cc4ff'; g.lineWidth = s * .05;
    if (k === 'rain') [-.15, 0, .15].forEach(o => { g.beginPath(); g.moveTo(x + s * o, py); g.lineTo(x + s * (o - .05), py + s * .14); g.stroke(); });
    if (k === 'snow') { g.fillStyle = '#fff'; [-.15, 0, .15].forEach(o => circ(x + s * o, py + s * .07, s * .035)); }
    if (k === 'storm') { g.beginPath(); g.moveTo(x + s * .04, py - s * .02); g.lineTo(x - s * .06, py + s * .08); g.lineTo(x + s * .04, py + s * .08); g.lineTo(x - s * .04, py + s * .2); g.stroke(); }
  }
  const LBL = { sun: 'Despejado', part: 'Algo nublado', cloud: 'Nublado', rain: 'Lluvia', snow: 'Nieve', storm: 'Tormenta' };
  const kindOf = c => c === 0 ? 'sun' : c <= 2 ? 'part' : c <= 48 ? 'cloud' : (c <= 67 || (c >= 80 && c <= 82)) ? 'rain' : (c <= 77 || c === 85 || c === 86) ? 'snow' : c >= 95 ? 'storm' : 'cloud';

  const wea = widget(0.68, 0, g => {
    g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = `500 26px ${FONT}`; g.fillText(CITY, 32, 58);
    if (!wx) { g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `400 22px ${FONT}`; g.fillText(wxErr ? 'Sin conexión' : 'Cargando…', 32, 100); return; }
    g.font = `200 120px ${FONT}`; g.fillText(Math.round(wx.t) + '°', 28, 180);
    icon(g, wx.k, 318, 120, 76);
    g.font = `400 21px ${FONT}`; g.fillStyle = 'rgba(255,255,255,.7)';
    g.fillText(`${LBL[wx.k]} · ${Math.round(wx.max)}° / ${Math.round(wx.min)}°`, 32, 222);
    g.textAlign = 'center';
    wx.days.forEach((d, i) => {
      const cx = 77 + 123 * i;
      g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `500 18px ${FONT}`; g.fillText(d.n, cx, 270);
      icon(g, d.k, cx, 312, 40);
      g.fillStyle = 'rgba(255,255,255,.92)'; g.font = `400 20px ${FONT}`; g.fillText(`${Math.round(d.max)}° ${Math.round(d.min)}°`, cx, 372);
    });
  });

  async function loadWeather() {
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`);
      const j = await r.json(), c = j.current, d = j.daily;
      wx = {
        t: c.temperature_2m, k: kindOf(c.weather_code), max: d.temperature_2m_max[0], min: d.temperature_2m_min[0],
        days: [1, 2, 3].map(i => ({
          n: cap(new Intl.DateTimeFormat(undefined, { weekday: 'short' }).format(new Date(d.time[i] + 'T12:00')).replace('.', '')),
          k: kindOf(d.weather_code[i]), max: d.temperature_2m_max[i], min: d.temperature_2m_min[i]
        }))
      };
      wxErr = false;
    } catch (e) { wxErr = true; }
    wAll();
  }
  function wTap(h) {                   // calendario: ‹ › cambian de mes, el título vuelve a hoy; clima: actualiza
    if (h.own === cal) {
      const x = h.uv.x * 400, y = (1 - h.uv.y) * 400;
      if (y < 85) { calOff = x > 328 ? calOff + 1 : x > 268 ? calOff - 1 : 0; wAll(); }
    } else loadWeather();
  }
  layout(); wAll(); loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  setInterval(wAll, 60 * 1000);
  if (document.fonts && document.fonts.load) {
    Promise.all(['200 100px Inter', '300 100px Inter', '400 40px Inter', '500 40px Inter'].map(f => document.fonts.load(f)))
      .then(() => { lastSecond = -1; drawOrn(); drawGrab(); wAll(); }).catch(() => {});
  }

  // Vista previa en pantalla: clic sobre el panel
  renderer.domElement.addEventListener('pointerdown', e => {
    if (renderer.xr.isPresenting) return;
    const m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(m, camera);
    if (raycaster.intersectObject(panel).length) toggleFormat();
  });

  /* ---------- Sesión AR ---------- */
  let session = null, placed = true, frames = 0;
  const v = new THREE.Vector3(), dir = new THREE.Vector3();

  function placeInFront() {
    const xrCam = renderer.xr.getCamera(camera);
    xrCam.getWorldPosition(v);
    if (v.y < 0.2 && frames < 90) return;   // espera a que el seguimiento tenga la altura real
    xrCam.getWorldDirection(dir);
    dir.y = 0;
    if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1);
    dir.normalize();
    scene.attach(group);
    group.position.set(v.x + dir.x * 1.2, v.y - 0.05, v.z + dir.z * 1.2);
    group.lookAt(v.x, group.position.y, v.z);
    layout();
    placed = true;
  }

  function resetDesktop() {
    scene.attach(group);
    group.position.copy(HOME);
    group.rotation.set(0, 0, 0);
    group.scale.setScalar(1);
    layout();
  }

  function log(t) { msg.textContent = t; }

  async function startAR() {
    if (session) { session.end(); return; }
    log('1/3 Pidiendo sesión AR…');
    let s;
    try {
      try {
        s = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['local-floor'] });
      } catch (e1) {
        log('1/3 Reintentando sin opciones (' + (e1 && e1.message ? e1.message : e1) + ')…');
        s = await navigator.xr.requestSession('immersive-ar');
      }
      log('2/3 Sesión concedida. Preparando el render…');
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(s);
      session = s;
      placed = false; frames = 0;
      enterBtn.textContent = 'Salir de AR';
      log('3/3 Sesión AR activa.');
      s.addEventListener('end', () => {
        session = null;
        enterBtn.textContent = 'Entrar en AR';
        resetDesktop();
        log('La sesión AR terminó.' + (lastError ? ' Último error: ' + lastError : ''));
      });
    } catch (err) {
      log('Falló la AR: ' + (err && err.name ? err.name + ' – ' : '') + (err && err.message ? err.message : err));
    }
  }

  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then(ok => {
      if (ok) {
        enterBtn.hidden = false;
        msg.textContent = 'Gatillo para cambiar 12/24 h. Agarre (lateral) para mover el reloj.';
      } else {
        msg.textContent = 'Este navegador no admite AR inmersiva. Ábrelo desde el navegador del Quest (por HTTPS).';
      }
    }).catch(() => { msg.textContent = 'No se pudo comprobar la compatibilidad con AR.'; });
  } else {
    msg.textContent = 'Este navegador no tiene WebXR. Ábrelo desde el navegador del Quest (por HTTPS).';
  }
  enterBtn.addEventListener('click', startAR);

  /* ---------- Bucle ---------- */
  let lastSecond = -1;
  let lastError = '';
  addEventListener('error', e => { lastError = e.message; log('Error: ' + e.message); });
  addEventListener('unhandledrejection', e => {
    const r = e.reason;
    lastError = r && r.message ? r.message : String(r);
    log('Error: ' + lastError);
  });

  renderer.setAnimationLoop(() => {
    try {
      const now = new Date();
      const s = now.getSeconds();
      if (s !== lastSecond) { lastSecond = s; draw(now); }
      bar.scale.x = Math.max(0.001, (s * 1000 + now.getMilliseconds()) / 60000);

      if (renderer.xr.isPresenting && !placed) { frames++; placeInFront(); }
      if (renderer.xr.isPresenting) updateXR();
      renderer.render(scene, camera);
    } catch (err) {
      lastError = err && err.message ? err.message : String(err);
      log('Error en el render: ' + lastError);
      renderer.setAnimationLoop(null);
      if (session) session.end();
    }
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
